[build]
  command = "pnpm build"
  publish = "dist"

# The env vars were imported all marked "secret", so the scan fails whenever a
# public value also appears in the code or the built site. None of these is
# secret (VITE_* ship in the public bundle; the rest are names, addresses and
# IDs that appear on the site or in emails). Still scanned: RESEND_API_KEY,
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, SENTRY_AUTH_TOKEN, FORMS_INTAKE_SECRET.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SANITY_PROJECT_ID,VITE_SANITY_DATASET,VITE_SANITY_API_VERSION,VITE_SITE_URL,VITE_SENTRY_DSN,VITE_SENTRY_ENV,DONATION_ORG_NAME,DONATION_EIN,CONTACT_FROM_EMAIL,CONTACT_TO_EMAIL,SENTRY_ORG,SENTRY_PROJECT,STRIPE_PORTAL_LOGIN_URL,FORMS_INTAKE_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=()"
    # The site's own host only. includeSubDomains/preload would force HTTPS on
    # every subdomain of the client's domain, including ones run by their IT
    # provider (mail, devices), which RMWS couldn't risk.
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://scripts.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.sanity.io https://i.ytimg.com https://queue.simpleanalyticscdn.com; font-src 'self' data:; connect-src 'self' https://*.api.sanity.io https://*.apicdn.sanity.io https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://queue.simpleanalyticscdn.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
